name: Auto convert images to WebP
on:
  workflow_dispatch:
  push:
    branches: [ main ]         # 기본 브랜치가 master면 master로
permissions:
  contents: write              # 커밋/푸시 권한

jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Convert JPG/PNG to WebP with auto-rotate (overwrite)
        run: |
          set -e
          TMPDIR=".autowebp_tmp"
          mkdir -p "$TMPDIR"
          find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) \
            -not -path "./.git/*" -not -path "./node_modules/*" -print0 |
          while IFS= read -r -d '' f; do
            out="${f%.*}.webp"
            tmp="$TMPDIR/tmp.png"
            # 1) 방향 메타를 픽셀에 반영(autorotate) + 메타 제거
            magick "$f" -auto-orient -strip "$tmp"
            # 2) webp 생성 (PNG는 무손실, 사진류는 q=80 권장)
            if echo "$f" | grep -qi '\.png$'; then
              rm -f "$out"; cwebp -lossless -z 9 -m 6 "$tmp" -o "$out"
            else
              rm -f "$out"; cwebp -q 80 "$tmp" -o "$out"
            fi
            echo "made: $out"
          done

      # (선택) PNG 아이콘/로고는 경로를 바꾸지 않으려면 아래처럼 JPG/JPEG만 치환
      - name: Rewrite .jpg links to .webp in code files
        run: |
          set -e
          git ls-files -z '*.html' '*.htm' '*.md' '*.markdown' '*.css' '*.js' '*.jsx' '*.tsx' \
          | xargs -0 -I{} bash -c 'sed -i -E "s/\.(jpg|jpeg)\b/.webp/gI" "$1"' _ {}

      - name: Commit & push changes
        run: |
          git config user.name  "webp-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix: autorotate images before webp + rewrite refs" || exit 0
          git push
