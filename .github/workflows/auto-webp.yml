name: Auto convert images to WebP
on:
  workflow_dispatch: {} 
permissions:
  contents: write

jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Convert JPG/PNG to WebP with auto-rotate (overwrite)
        shell: bash
        run: |
          set -euo pipefail
          TMPDIR=".autowebp_tmp"
          mkdir -p "$TMPDIR"

          # ImageMagick 바이너리 이름 감지 (v7=magick, v6=convert)
          if command -v magick >/dev/null 2>&1; then
            IM=magick
          else
            IM=convert
          fi

          # 파이프 대신 프로세스 서브스티튜션으로 Broken pipe 방지
          while IFS= read -r -d '' f; do
            out="${f%.*}.webp"
            tmp="$TMPDIR/tmp.png"

            # 1) EXIF 회전 반영 + 메타 제거
            "$IM" "$f" -auto-orient -strip "$tmp"

            # 2) webp 생성 (PNG는 무손실, 사진류는 q=80)
            if [[ "$f" =~ \.png$ ]]; then
              rm -f "$out"; cwebp -lossless -z 9 -m 6 "$tmp" -o "$out"
            else
              rm -f "$out"; cwebp -q 80 "$tmp" -o "$out"
            fi
            echo "made: $out"
          done < <(find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \) \
                    -not -path './.git/*' -not -path './node_modules/*' -print0)

      # JPG/JPEG만 경로 치환 (PNG 아이콘/로고는 유지)
      - name: Rewrite .jpg links to .webp in code files
        run: |
          set -e
          git ls-files -z '*.html' '*.htm' '*.md' '*.markdown' '*.css' '*.js' '*.jsx' '*.tsx' \
          | xargs -0 -I{} bash -c 'sed -i -E "s/\.(jpg|jpeg)\b/.webp/gI" "$1"' _ {}

      - name: Commit & push changes
        run: |
          git config user.name  "webp-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix: autorotate images before webp + rewrite refs" || exit 0
          git push
