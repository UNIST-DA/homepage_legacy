name: Auto convert images to WebP

on:
  workflow_dispatch:      # 필요시 수동 실행 버튼
  push:
    branches: [ main ]    # 기본 브랜치가 master면 master로 바꾸기

jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Convert JPG/PNG to WebP (keep originals)
        run: |
          set -e
          # jpg/jpeg/png 모두 webp로 변환 (원본은 그대로 둠)
          find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) \
            -not -path "./.git/*" -not -path "./node_modules/*" -print0 \
          | while IFS= read -r -d '' f; do
              out="${f%.*}.webp"
              # 이미 webp가 있으면 건너뛰기
              [ -f "$out" ] && continue
              ext="${f##*.}"
              if echo "$ext" | grep -qi png; then
                # PNG는 로고/아이콘 품질 보존 위해 무손실
                cwebp -lossless -z 9 -m 6 "$f" -o "$out"
              else
                # 사진류는 용량 절감(필요하면 -q 값 조절)
                cwebp -q 75 "$f" -o "$out"
              fi
              echo "made: $out"
            done

      - name: Rewrite .jpg/.png links to .webp in code files
        run: |
          set -e
          # 사이트 소스(추가하고 싶은 확장자 있으면 뒤에 더 붙여도 됨)
          git ls-files -z '*.html' '*.htm' '*.md' '*.markdown' '*.css' '*.js' '*.jsx' '*.tsx' \
          | xargs -0 -I{} bash -c \
              'sed -i -E "s/\.(jpg|jpeg|png)\b/.webp/gI" "$1"' _ {}

      - name: Commit & push changes
        run: |
          git config user.name  "webp-bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "chore: convert images to WebP & rewrite references" || exit 0
          git push

