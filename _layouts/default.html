<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.title }}" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS (cache-busting) -->
  <link rel="stylesheet" href="{{ '/assets/style.css?v=' | append: site.github.build_revision | relative_url }}">

  <!-- ✅ Favicon (이 부분은 반드시 head 안에 위치) -->
  <link rel="icon" type="image/png" href="{{ '/assets/hero/LabSign_DA_background.webp' | relative_url }}">
</head>
  
<body>
  {% include header.html %}
  {{ content }}
  {% include footer.html %}

  <!-- 모바일 드롭다운 토글 -->
  <script>
    (function(){
      function toggleFrom(target){
        const link = target.closest('.has-dd > a');
        if(!link) return false;
        const nav = document.getElementById('navbar');
        if(!nav || !nav.contains(link)) return false;
    
        const li = link.closest('.has-dd');
        const expanded = li.classList.toggle('open');
        link.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        return true;
      }
    
      function onClick(e){
        if (toggleFrom(e.target)) { e.preventDefault(); e.stopPropagation(); }
      }
    
      // click만 사용 (중복 토글 방지)
      document.addEventListener('click', onClick, true);

      // Safari 대응: 상위 앵커 기본 이동 확실히 차단
      document.querySelectorAll('#navbar .has-dd > a').forEach(a => {
        a.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); }, true);
        a.setAttribute('href', 'javascript:void(0)');
        a.setAttribute('aria-haspopup', 'true');
        if(!a.hasAttribute('aria-expanded')) a.setAttribute('aria-expanded', 'false');
        });
    })();
    </script>
</body>
</html>
