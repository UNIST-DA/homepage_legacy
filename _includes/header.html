<header>
  <div class="container nav" id="navbar">
    <!-- Brand -->
    <a class="brand brand-link" href="{{ '/' | relative_url }}">
      <img class="brand-img"
           src="{{ '/assets/hero/LabSign_DA_only.webp?v=' | append: site.github.build_revision | relative_url }}"
           alt="DA-Lab logo" loading="eager" decoding="async">
      <span class="brand-text">
        <span class="brand-main">Data Analytics Lab</span> · <span class="muted">UNIST IE</span>
      </span>
    </a>

    <!-- Mobile menu button -->
    <button class="menu-btn" aria-label="Toggle Menu"
            onclick="document.getElementById('navbar').classList.toggle('open')">☰</button>

    <!-- Main nav -->
    <ul>
      <li>
        <a href="{{ '/about.html' | relative_url }}">About</a>
      </li>

      <!-- Members -->
      <li class="has-dd">
        <!-- 상위 메뉴를 버튼으로 -->
        <button class="dd-trigger" aria-expanded="false" aria-controls="dd-members">Members</button>
        <ul id="dd-members" class="dropdown" role="menu">
          <!-- 상위 페이지로 가는 View all -->
          <li class="view-all"><a role="menuitem" href="{{ '/members/professor/' | relative_url }}">View all Members</a></li>
          <li role="none"><a role="menuitem" href="{{ '/members/professor/' | relative_url }}">Professor</a></li>
          <li role="none"><a role="menuitem" href="{{ '/members/students/'  | relative_url }}">Students</a></li>
          <li role="none"><a role="menuitem" href="{{ '/members/alumni/'    | relative_url }}">Alumni</a></li>
        </ul>
      </li>

      <!-- Research -->
      <li class="has-dd">
        <button class="dd-trigger" aria-expanded="false" aria-controls="dd-research">Research</button>
        <ul id="dd-research" class="dropdown" role="menu">
          <li class="view-all"><a role="menuitem" href="{{ '/research/projects/' | relative_url }}">View all Research</a></li>
          <li role="none"><a role="menuitem" href="{{ '/research/projects/'     | relative_url }}">Projects</a></li>
          <li role="none"><a role="menuitem" href="{{ '/research/publications/' | relative_url }}">Publications</a></li>
        </ul>
      </li>

      <!-- Activity -->
      <li class="has-dd">
        <button class="dd-trigger" aria-expanded="false" aria-controls="dd-activity">Activity</button>
        <ul id="dd-activity" class="dropdown" role="menu">
          <li class="view-all"><a role="menuitem" href="{{ '/activity/Lab%20News/' | relative_url }}">View all Activity</a></li>
          <li role="none"><a role="menuitem" href="{{ '/activity/Lab%20News/'    | relative_url }}">Lab News</a></li>
          <li role="none"><a role="menuitem" href="{{ '/activity/Lab%20Events/'  | relative_url }}">Lab Events</a></li>
          <li role="none"><a role="menuitem" href="{{ '/activity/Lab%20Seminar/' | relative_url }}">Lab Seminar</a></li>
        </ul>
      </li>

      <!-- Contact -->
      <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
    </ul>

    <!-- Theme toggle button -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme" aria-pressed="false">
      <svg class="sun" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 4V2M12 22v-2M4.93 4.93 3.52 3.52M20.48 20.48l-1.41-1.41M4 12H2m20 0h-2M4.93 19.07 3.52 20.48M20.48 3.52 19.07 4.93" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
      </svg>
    </button>
  </div>
</header>

<!-- Galaxy canvas -->
<canvas id="galaxy-canvas"></canvas>

<!-- Theme & Galaxy JS -->
<script defer src="{{ '/assets/main/theme.js?v=' | append: site.github.build_revision | relative_url }}"></script>
<script defer src="{{ '/assets/main/nav.js?v=' | append: site.github.build_revision | relative_url }}"></script>
